model:
  class_path: dnabert.models.DnaBertForPretraining
  config:
    base:
      max_length: 250
      kmer: 3
      kmer_stride: 1
      normalize_sequences: true
      embed_dim: 768
      num_heads: 12
      num_layers: 6
      feedforward_dim: 2048
      activation: gelu
    min_mask_ratio: 0.15
    max_mask_ratio: 0.15
datamodule:
  class_path: dnabert.datamodules.DnaBertPretrainingDataModule
  config:
    tokenizer: ${model.base.tokenizer}
    train_sequences_path: /home/data2/deepdna/datasets/silva_nr99_filtered_515f_806r/sequences.fasta.db
    test_sequences_path: null
    val_split: 0.0
    min_length: 65
    max_length: 250
    reverse_complement: true
    batch_size: 128
    num_workers: 0
train:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: 1000
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 50
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
